<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wishlist Alerts</title>
  <style>
    :root{color-scheme:light dark;--bg:#f6f7f8;--card:#fff;--text:#18202a;--muted:#667085;--line:#d9dee5;--accent:#2459c4;--ok:#137a45;--warn:#9a6700;--bad:#b42318}
    @media(prefers-color-scheme:dark){:root{--bg:#11151a;--card:#1b2129;--text:#edf1f5;--muted:#aab3bf;--line:#39424e;--accent:#83aaff;--ok:#54c88a;--warn:#e6b84c;--bad:#ff8178}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:960px;margin:auto;padding:24px}header,.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:1.7rem}h2{font-size:1.25rem;margin:.2rem 0}.muted{color:var(--muted)}form,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}.add{display:grid;grid-template-columns:minmax(260px,1fr) auto auto auto;gap:12px;align-items:end}label{display:grid;gap:5px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--card);color:var(--text)}button{cursor:pointer}button.primary{color:white;background:var(--accent);border-color:var(--accent)}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.error{color:var(--bad);min-height:1.5em}.badge,.chip{white-space:nowrap;font-size:.8rem;border:1px solid currentColor;border-radius:999px;padding:2px 8px}.ok{color:var(--ok)}.stale{color:var(--warn)}.bad{color:var(--bad)}details{margin-top:14px}summary{cursor:pointer;font-weight:600}table{border-collapse:collapse;width:100%;margin-top:10px}th,td{white-space:nowrap;text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:.8rem;color:var(--muted)}img{width:40px;height:40px;object-fit:contain;background:white}.item-title{min-width:220px;white-space:normal}td input[type=number]{width:100px}dialog{max-width:720px;width:90%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}dialog::backdrop{background:#0008}@media(max-width:720px){.add{grid-template-columns:1fr}.table-wrap{overflow:auto}main{padding:14px}}
  </style>
</head>
<body><main>
  <header><div><h1>Wishlist Alerts</h1><div id="email" class="muted">Loading…</div></div><button id="test-email">Send test email</button></header>
  <form id="add" class="add"><div><label for="url">Amazon wishlist URL</label><input id="url" name="url" type="url" required placeholder="https://www.amazon.com/hz/wishlist/ls/…"></div><label>Frequency<select name="frequency"><option value="daily">Daily</option><option value="hourly">Hourly</option></select></label><label><span>Add new items automatically</span><input name="addNewItems" type="checkbox" checked></label><button class="primary">Add wishlist</button><div id="add-error" class="error" role="alert"></div></form>
  <section id="lists" aria-live="polite"></section>
  <dialog id="history"><div class="row"><h2>Price history</h2><button id="close-history">Close</button></div><div class="table-wrap"><table><thead><tr><th>Observed</th><th>Price</th><th>Availability</th></tr></thead><tbody></tbody></table></div></dialog>
</main><script>
const $=s=>document.querySelector(s), api=async(path,options={})=>{const r=await fetch(path,{...options,headers:{'content-type':'application/json',...options.headers}}),data=await r.json();if(!r.ok)throw Object.assign(new Error(data.detail||data.error||'Request failed'),{status:r.status,data});return data};
const money=c=>c==null?'—':`$${(c/100).toFixed(2)}`, relative=value=>{if(!value)return'never';const seconds=Math.round((Date.parse(value)-Date.now())/1000),abs=Math.abs(seconds),unit=abs<60?'second':abs<3600?'minute':abs<86400?'hour':'day',n=unit==='second'?seconds:unit==='minute'?Math.round(seconds/60):unit==='hour'?Math.round(seconds/3600):Math.round(seconds/86400);return new Intl.RelativeTimeFormat(undefined,{numeric:'auto'}).format(n,unit)};
function el(tag,text,cls){const node=document.createElement(tag);if(text!=null)node.textContent=text;if(cls)node.className=cls;return node}function button(text,fn){const b=el('button',text);b.type='button';b.onclick=fn;return b}
async function load(){try{const [me,lists]=await Promise.all([api('/api/me'),api('/api/wishlists')]);$('#email').textContent=me.email;const root=$('#lists');root.textContent='';if(!lists.length){root.append(el('p','No wishlists yet. Paste a shared Amazon wishlist link above.','muted'));return}for(const summary of lists){const detail=await api(`/api/wishlists/${summary.id}`);root.append(render(detail))}}catch(e){$('#lists').textContent=e.message}}
function render(data){const w=data.wishlist,card=el('article',null,'card'),top=el('div',null,'row'),heading=document.createElement('div');heading.append(el('h2',w.name),el('span',`${data.items.length} item(s) · ${w.frequency} · last checked ${relative(w.last_success_at)}`,'muted'));const state=w.stale?'stale':w.last_status||'stale',badge=el('span',state,state==='ok'?'badge ok':state==='stale'?'badge stale':'badge bad');heading.append(' ',badge);if(w.last_error)heading.append(el('div',w.last_error,'error'));const controls=el('div',null,'row'),pause=button(w.monitored?'Pause':'Resume',async()=>{await api(`/api/wishlists/${w.id}`,{method:'PATCH',body:JSON.stringify({monitored:!w.monitored})});load()}),check=button('Check now',async()=>{check.disabled=true;check.textContent='checking…';try{await api(`/api/wishlists/${w.id}/check`,{method:'POST'});setTimeout(load,10000)}catch(e){alert(e.message);check.disabled=false;check.textContent='Check now'}}),freq=el('select');for(const value of['daily','hourly']){const o=el('option',value[0].toUpperCase()+value.slice(1));o.value=value;o.selected=w.frequency===value;freq.append(o)}freq.setAttribute('aria-label','Check frequency');freq.onchange=async()=>{await api(`/api/wishlists/${w.id}`,{method:'PATCH',body:JSON.stringify({frequency:freq.value})});load()};controls.append(pause,check,freq);top.append(heading,controls);card.append(top);
 const details=el('details'),summary=el('summary',`Items (${data.items.length})`),wrap=el('div',null,'table-wrap'),table=el('table'),thead=el('thead'),hr=el('tr');for(const h of['','Item','Current','First seen','Lowest','Target','Monitor','Status',''])hr.append(el('th',h));thead.append(hr);const tbody=el('tbody');for(const item of data.items)tbody.append(itemRow(item));table.append(thead,tbody);wrap.append(table);details.append(summary,wrap);card.append(details);return card}
function itemRow(item){const tr=el('tr'),image=el('td');if(item.image_url){const img=el('img');img.src=item.image_url;img.alt='';image.append(img)}const title=el('td',null,'item-title'),link=el('a',item.title);link.href=item.product_url;link.target='_blank';link.rel='noopener';title.append(link);const current=el('td',money(item.current_cents)),baseline=el('td',money(item.baseline_cents)),lowest=el('td',money(item.lowest_cents)),targetCell=el('td'),target=el('input');target.type='number';target.step='.01';target.min='0';target.value=item.target_cents==null?'':(item.target_cents/100).toFixed(2);target.setAttribute('aria-label',`Target price for ${item.title}`);target.onchange=()=>api(`/api/items/${item.id}`,{method:'PATCH',body:JSON.stringify({targetCents:target.value===''?null:Math.round(Number(target.value)*100)})}).catch(e=>alert(e.message));targetCell.append(target);const monitorCell=el('td'),monitor=el('input');monitor.type='checkbox';monitor.checked=!!item.monitored;monitor.setAttribute('aria-label',`Monitor ${item.title}`);monitor.onchange=()=>api(`/api/items/${item.id}`,{method:'PATCH',body:JSON.stringify({monitored:monitor.checked})}).catch(e=>alert(e.message));monitorCell.append(monitor);const statusText=item.alert_active?'alert active':item.availability==='unavailable'?'unavailable':item.current_cents==null?'no price':'watching',status=el('td');status.append(el('span',statusText,'chip'));status.append(el('div',relative(item.observed_at),'muted'));const action=el('td');action.append(button('History',()=>history(item)));tr.append(image,title,current,baseline,lowest,targetCell,monitorCell,status,action);return tr}
async function history(item){try{const rows=await api(`/api/items/${item.id}/history`),tbody=$('#history tbody');tbody.textContent='';for(const row of rows){const tr=el('tr');tr.append(el('td',new Date(row.observed_at).toLocaleString()),el('td',money(row.price_cents)),el('td',row.availability));tbody.append(tr)}$('#history').showModal()}catch(e){alert(e.message)}}
$('#close-history').onclick=()=>$('#history').close();$('#test-email').onclick=async e=>{e.currentTarget.disabled=true;try{const result=await api('/api/test-email',{method:'POST'});alert(result.status==='sent'?'Test email sent.':'Test email failed.')}catch(error){alert(error.message)}finally{e.currentTarget.disabled=false}};
$('#add').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.currentTarget),error=$('#add-error');error.textContent='';try{await api('/api/wishlists',{method:'POST',body:JSON.stringify({url:form.get('url'),frequency:form.get('frequency'),addNewItems:form.has('addNewItems')})});e.currentTarget.reset();load()}catch(ex){const messages={login_required:'This list is private or requires login',private:'This list is private',blocked:'Amazon blocked this request',not_found:'This wishlist was not found',invalid_url:'Use a shared Amazon US wishlist link'};error.textContent=messages[ex.data?.error]||ex.message}};load();
</script></body></html>
