<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wishlist Alerts</title>
  <style>
    :root{color-scheme:light dark;
      --bg:oklch(97% 0.008 250);--surface:oklch(99.2% 0.004 250);--raised:oklch(94.5% 0.012 250);
      --ink:oklch(24% 0.025 260);--muted:oklch(48% 0.025 258);--line:oklch(88% 0.014 250);
      --accent:oklch(50% 0.17 258);--accent-ink:oklch(99% 0.01 258);--accent-tint:oklch(93% 0.04 258);
      --sale:oklch(44% 0.11 188);--sale-tint:oklch(93% 0.05 188);
      --warn:oklch(46% 0.12 75);--warn-tint:oklch(94% 0.07 85);
      --bad:oklch(48% 0.18 25);--bad-tint:oklch(94% 0.05 25)}
    @media(prefers-color-scheme:dark){:root{
      --bg:oklch(19% 0.02 255);--surface:oklch(23% 0.02 255);--raised:oklch(28% 0.024 255);
      --ink:oklch(94% 0.01 250);--muted:oklch(70% 0.02 250);--line:oklch(33% 0.022 255);
      --accent:oklch(76% 0.12 250);--accent-ink:oklch(18% 0.03 255);--accent-tint:oklch(31% 0.06 255);
      --sale:oklch(80% 0.11 185);--sale-tint:oklch(30% 0.05 188);
      --warn:oklch(83% 0.12 85);--warn-tint:oklch(32% 0.06 80);
      --bad:oklch(78% 0.14 22);--bad-tint:oklch(32% 0.07 25)}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1040px;margin:auto;padding:clamp(14px,3vw,32px)}
    header{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:18px;margin-bottom:22px;border-bottom:2px solid var(--accent)}
    h1{font-size:1.55rem;letter-spacing:-.01em;margin:0 0 2px}h2{font-size:1.15rem;margin:0}
    .muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    form.add{display:grid;grid-template-columns:minmax(260px,1fr) auto auto auto;gap:14px;align-items:end;background:var(--accent-tint);border-radius:10px;padding:16px 18px;margin:0 0 28px}
    .deals{margin:0 0 26px}.deals h2{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}.deals h2 .muted{font-size:.9rem;font-weight:400}
    .deal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
    .deal{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sale);border-radius:8px;padding:12px}
    .deal img{width:48px;height:48px}.deal .t{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .deal .p{margin-top:6px;font-variant-numeric:tabular-nums}.deal .p strong{color:var(--sale);font-size:1.05rem}.deal .p s{color:var(--muted);margin-left:6px}.deal .pct{margin-left:8px;font-size:.78rem;font-weight:600;color:var(--sale);background:var(--sale-tint);border-radius:999px;padding:1px 7px}
    .deal .l{font-size:.78rem;color:var(--muted);margin-top:4px}
    .actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.actions button{font-size:.72rem;padding:4px 7px}
    .planner{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 20px}.planner ol{padding-left:24px}.planner li{margin:10px 0}.planner label{display:flex;align-items:center;gap:8px}.planner input{width:100px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 18px}
    label{display:grid;gap:5px;font-size:.85rem;color:var(--muted)}label.check{grid-template-columns:auto 1fr;align-items:center;padding-bottom:9px}
    input,select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
    input:hover,select:hover{border-color:var(--muted)}
    button{cursor:pointer;background:var(--raised);border-color:transparent;font-weight:500}button:hover{background:var(--line)}
    button.primary{color:var(--accent-ink);background:var(--accent)}button.primary:hover{filter:brightness(1.1)}
    button:disabled{opacity:.55;cursor:wait}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}a:hover{text-decoration-thickness:2px}
    .error{color:var(--bad);min-height:1.5em;font-size:.9rem}
    .badge,.chip{white-space:nowrap;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--raised);color:var(--muted)}
    .ok{color:var(--sale);background:var(--sale-tint)}.stale{color:var(--warn);background:var(--warn-tint)}.bad{color:var(--bad);background:var(--bad-tint)}
    .chip.sale{color:var(--sale);background:var(--sale-tint)}
    details{margin-top:14px}summary{cursor:pointer;font-weight:600;color:var(--accent)}
    table{border-collapse:collapse;width:100%;margin-top:12px;font-variant-numeric:tabular-nums}
    th,td{white-space:nowrap;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
    th{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--raised)}
    tbody tr:hover{background:color-mix(in oklch,var(--accent-tint) 45%,transparent)}
    td.num{text-align:right}th.num{text-align:right}
    td.price-sale{color:var(--sale);font-weight:600}td.price-up{color:var(--bad)}
    .delta{display:block;font-size:.75rem;font-weight:500}
    img{width:40px;height:40px;object-fit:contain;background:oklch(99% 0 0);border-radius:4px}
    .item-title{min-width:220px;white-space:normal}td input[type=number]{width:96px}
    .search{max-width:420px;margin:0 0 18px}.delivery{font-size:.82rem}.delivery.bad{background:none;padding:0}.target{display:flex;gap:6px;align-items:end}.target label{font-size:.72rem}.matching{margin-left:8px;font-weight:400}.edition{font-size:.75rem;color:var(--muted)}.redrop{display:flex!important;align-items:center;gap:5px}.redrop input{width:62px}
    dialog{max-width:720px;width:90%;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}dialog::backdrop{background:oklch(20% 0.02 255 / .6)}
    @media(max-width:720px){form.add{grid-template-columns:1fr}.table-wrap{overflow:auto}}
    details{overflow-x:auto;max-width:100%}.table-wrap{overflow-x:auto;max-width:100%}.row-actions{display:flex;gap:6px;align-items:center}.row-actions select{padding:6px 8px;font-size:.85rem}
    td .edition{display:block;margin-top:4px;font-size:.8rem;padding:3px 6px;max-width:220px;color:var(--muted)}
  </style>
</head>
<body><main>
  <header><div><h1>Wishlist Alerts</h1><div id="email" class="muted">Loading…</div></div><button id="test-email">Send test email</button></header>
  <form id="add" class="add"><div><label for="url">Amazon wishlist URL</label><input id="url" name="url" type="url" required placeholder="https://www.amazon.com/hz/wishlist/ls/…"></div><label>Frequency<select name="frequency"><option value="daily">Daily</option><option value="hourly">Hourly</option></select></label><label class="check"><input name="addNewItems" type="checkbox" checked><span>Add new items automatically</span></label><button class="primary">Add wishlist</button><div id="add-error" class="error" role="alert"></div></form>
  <section class="planner" aria-labelledby="buy-title"><div class="row"><div><h2 id="buy-title">Buy next</h2><div class="muted">A shortlist of unusually good prices within your budget.</div></div><label>Budget $ <input id="budget" type="number" min="5" max="10000" step="1" value="60"><button id="plan" class="primary">Plan</button></label></div><div id="plan-results"></div></section>
  <section id="deals" aria-label="Current deals"></section>
  <label class="search" for="search">Find an item<input id="search" type="search" placeholder="Find an item"></label>
  <section id="lists" aria-live="polite"></section>
  <dialog id="history"><div class="row"><h2>Price history</h2><button id="close-history">Close</button></div><div class="table-wrap"><table><thead><tr><th>Observed</th><th>Price</th><th>Availability</th></tr></thead><tbody></tbody></table></div></dialog>
</main><script>
const $=s=>document.querySelector(s), api=async(path,options={})=>{const r=await fetch(path,{...options,headers:{'content-type':'application/json',...options.headers}}),data=await r.json();if(!r.ok)throw Object.assign(new Error(data.detail||data.error||'Request failed'),{status:r.status,data});return data};
const money=c=>c==null?'—':`$${(c/100).toFixed(2)}`, relative=value=>{if(!value)return'never';const seconds=Math.round((Date.parse(value)-Date.now())/1000),abs=Math.abs(seconds),unit=abs<60?'second':abs<3600?'minute':abs<86400?'hour':'day',n=unit==='second'?seconds:unit==='minute'?Math.round(seconds/60):unit==='hour'?Math.round(seconds/3600):Math.round(seconds/86400);return new Intl.RelativeTimeFormat(undefined,{numeric:'auto'}).format(n,unit)};
function el(tag,text,cls){const node=document.createElement(tag);if(text!=null)node.textContent=text;if(cls)node.className=cls;return node}function button(text,fn){const b=el('button',text);b.type='button';b.onclick=fn;return b}
let dealData=[],query='';
async function load(){try{const [me,lists,deals]=await Promise.all([api('/api/me'),api('/api/wishlists'),api('/api/deals')]);$('#email').textContent=me.email;dealData=deals;renderDeals();const root=$('#lists');root.textContent='';if(!lists.length){root.append(el('p','No wishlists yet. Paste a shared Amazon wishlist link above.','muted'));return}for(const summary of lists)root.append(render(summary))}catch(e){$('#lists').textContent=e.message}}
function feedback(id,status){const patch=status==='snoozed'?{status,snoozedUntil:new Date(Date.now()+30*86400000).toISOString().slice(0,10)}:{status};return api(`/api/items/${id}`,{method:'PATCH',body:JSON.stringify(patch)}).then(load).catch(e=>alert(e.message))}
function actionButtons(item){const actions=el('div',null,'actions');actions.append(button('Bought',()=>feedback(item.id,'bought')),button('Not interested',()=>feedback(item.id,'dropped')),button('Snooze 30d',()=>feedback(item.id,'snoozed')));return actions}
function renderDeals(){const root=$('#deals'),deals=dealData.filter(d=>d.title.toLowerCase().includes(query));root.textContent='';root.className=deals.length?'deals':'';if(!deals.length)return;const h=el('h2','Current deals');h.append(el('span',`${deals.length} matching item${deals.length===1?'':'s'} below your first-seen price`,'muted'));const grid=el('div',null,'deal-grid');for(const d of deals){const card=el('div',null,'deal'),img=d.image_url?el('img'):el('div');if(d.image_url){img.src=d.image_url;img.alt=''}const body=el('div'),t=el('a',d.title,'t');t.href=d.product_url;t.target='_blank';t.rel='noopener';const p=el('div',null,'p'),pct=Math.round((d.baseline_cents-d.current_cents)/d.baseline_cents*100);p.append(el('strong',money(d.current_cents)),el('s',money(d.baseline_cents)),el('span',`−${pct}%`,'pct'));const editions=d.edition_count>1?` · ${d.edition_count} editions`:'';const l=el('div',`${d.list_name}${d.target_cents!=null&&d.current_cents<=d.target_cents?' · target hit':''}${editions} · ${relative(d.observed_at)}`,'l');body.append(t,p,l,actionButtons(d));card.append(img,body);grid.append(card)}root.append(h,grid)}
function render(w){const card=el('article',null,'card'),top=el('div',null,'row'),heading=document.createElement('div');card.dataset.listId=w.id;heading.append(el('h2',w.name),el('span',`${w.item_count} item(s) · ${w.frequency} · last checked ${relative(w.last_success_at)}`,'muted'));const state=w.stale?'stale':w.last_status||'stale',badge=el('span',state,state==='ok'?'badge ok':state==='stale'?'badge stale':'badge bad');heading.append(' ',badge);if(w.delivery_status==='sent')heading.append(' ',el('span',`Email sent ${relative(w.delivery_sent_at)}`,'muted delivery'));else if(w.delivery_status==='failed')heading.append(' ',el('span',`Email failed: ${w.delivery_error||'unknown error'}`,'delivery bad'));if(w.last_error)heading.append(el('div',w.last_error,'error'));const controls=el('div',null,'row'),pause=button(w.monitored?'Pause':'Resume',async()=>{await api(`/api/wishlists/${w.id}`,{method:'PATCH',body:JSON.stringify({monitored:!w.monitored})});load()}),check=button('Check now',()=>pollCheck(w.id,check)),freq=el('select'),sort=el('select'),redrop=el('input'),redropLabel=el('label','Alert again on a further','redrop');redrop.type='number';redrop.min='5';redrop.max='90';redrop.placeholder='off';redrop.value=w.redrop_pct??'';redrop.setAttribute('aria-label','Further drop percent');redrop.onchange=()=>api(`/api/wishlists/${w.id}`,{method:'PATCH',body:JSON.stringify({redropPct:redrop.value===''?null:Number(redrop.value)})}).catch(e=>alert(e.message));redropLabel.append(redrop,document.createTextNode('% drop'));for(const value of['daily','hourly']){const o=el('option',value[0].toUpperCase()+value.slice(1));o.value=value;o.selected=w.frequency===value;freq.append(o)}freq.setAttribute('aria-label','Check frequency');freq.onchange=async()=>{await api(`/api/wishlists/${w.id}`,{method:'PATCH',body:JSON.stringify({frequency:freq.value})});load()};for(const [value,label] of [['savings','Biggest savings'],['title','Title'],['lowest','Lowest price']]){const o=el('option',label);o.value=value;sort.append(o)}sort.setAttribute('aria-label','Sort items');sort.onchange=()=>renderItems(card,details,summary,sort.value);controls.append(pause,check,freq,sort,redropLabel);top.append(heading,controls);card.append(top);const details=el('details'),matching=el('span',null,'muted matching'),summary=el('summary',`Items (${w.item_count})`);summary.append(matching);details.ontoggle=()=>{if(details.open&&!card.items)loadItems(card,details,summary,sort.value)};details.append(summary);card.append(details);return card}
async function loadItems(card,details,summary,sort){details.append(el('div','Loading…','muted'));try{const data=await api(`/api/wishlists/${card.dataset.listId}`);card.items=data.items;renderItems(card,details,summary,sort)}catch(e){details.lastChild.textContent=e.message}}
function renderItems(card,details,summary,sort){if(!card.items)return;const items=card.items.filter(item=>item.title.toLowerCase().includes(query));items.sort(sort==='title'?(a,b)=>a.title.localeCompare(b.title):sort==='lowest'?(a,b)=>(a.current_cents??Infinity)-(b.current_cents??Infinity):(a,b)=>(a.current_cents??Infinity)/(a.baseline_cents||1)-(b.current_cents??Infinity)/(b.baseline_cents||1));summary.querySelector('.matching').textContent=query?` · ${items.length} matching`:'';const wrap=el('div',null,'table-wrap'),table=el('table'),thead=el('thead'),hr=el('tr');for(const h of['','Item','Current','First seen','Lowest','Target / alert','Priority','Monitor','Status','']){const th=el('th',h);if(['Current','First seen','Lowest'].includes(h))th.className='num';hr.append(th)}thead.append(hr);const tbody=el('tbody');for(const item of items)tbody.append(itemRow(item,card.items));table.append(thead,tbody);wrap.append(table);details.replaceChildren(summary,wrap)}
function itemRow(item,allItems){const tr=el('tr'),image=el('td');if(item.image_url){const img=el('img');img.src=item.image_url;img.alt='';image.append(img)}const title=el('td',null,'item-title'),link=el('a',item.title);link.href=item.product_url;link.target='_blank';link.rel='noopener';title.append(link);if(item.edition_title)title.append(el('div',`edition of ${item.edition_title}`,'edition'));const edition=el('select',null,'edition'),blank=el('option','Same book as…');blank.value='';edition.append(blank);for(const other of allItems.filter(other=>other.id!==item.id&&!other.edition_of)){const option=el('option',other.title.length>40?`${other.title.slice(0,37)}…`:other.title);option.value=other.id;option.selected=item.edition_of===other.id;edition.append(option)}edition.setAttribute('aria-label',`Edition link for ${item.title}`);edition.onchange=()=>api(`/api/items/${item.id}`,{method:'PATCH',body:JSON.stringify({editionOf:edition.value||null})}).then(load).catch(e=>alert(e.message));title.append(edition);const current=el('td',money(item.current_cents),'num'),baseline=el('td',money(item.baseline_cents),'num'),lowest=el('td',money(item.lowest_cents),'num');if(item.current_cents!=null&&item.baseline_cents>0&&item.current_cents!==item.baseline_cents){const pct=Math.round((item.current_cents-item.baseline_cents)/item.baseline_cents*100);current.className+=pct<0?' price-sale':' price-up';current.append(el('span',`${pct>0?'+':''}${pct}% vs first`,'delta'))}const targetCell=el('td'),fields=el('div',null,'target'),target=el('input'),threshold=el('input'),targetLabel=el('label','Target'),thresholdLabel=el('label','Alert at % off');target.type='number';target.step='.01';target.min='0';target.value=item.target_cents==null?'':(item.target_cents/100).toFixed(2);target.setAttribute('aria-label',`Target price for ${item.title}`);target.onchange=()=>api(`/api/items/${item.id}`,{method:'PATCH',body:JSON.stringify({targetCents:target.value===''?null:Math.round(Number(target.value)*100)})}).catch(e=>alert(e.message));threshold.type='number';threshold.min='1';threshold.max='99';threshold.value=item.pct_threshold;threshold.setAttribute('aria-label',`Alert at percent off for ${item.title}`);threshold.onchange=()=>api(`/api/items/${item.id}`,{method:'PATCH',body:JSON.stringify({pctThreshold:Number(threshold.value)})}).catch(e=>alert(e.message));targetLabel.append(target);thresholdLabel.append(threshold);fields.append(targetLabel,thresholdLabel);targetCell.append(fields);const priorityCell=el('td'),priority=el('select');for(const [value,label] of [['','—'],['must','Must'],['interested','Interested'],['someday','Someday']]){const option=el('option',label);option.value=value;option.selected=(item.priority??'')===value;priority.append(option)}priority.setAttribute('aria-label',`Priority for ${item.title}`);priority.onchange=()=>api(`/api/items/${item.id}`,{method:'PATCH',body:JSON.stringify({priority:priority.value||null})}).catch(e=>alert(e.message));priorityCell.append(priority);const monitorCell=el('td'),monitor=el('input');monitor.type='checkbox';monitor.checked=!!item.monitored;monitor.setAttribute('aria-label',`Monitor ${item.title}`);monitor.onchange=()=>api(`/api/items/${item.id}`,{method:'PATCH',body:JSON.stringify({monitored:monitor.checked})}).catch(e=>alert(e.message));monitorCell.append(monitor);const statusText=item.status!=='active'?item.status:item.alert_active?'on sale':item.availability==='unavailable'?'unavailable':item.current_cents==null?'no price':'watching',status=el('td');status.append(el('span',statusText,item.alert_active&&item.status==='active'?'chip sale':'chip'));status.append(el('div',relative(item.observed_at),'muted'));const action=el('td',null,'row-actions');const mark=el('select');mark.setAttribute('aria-label',`Mark ${item.title}`);for(const [v,t] of [['','Mark as…'],['bought','Bought'],['dropped','Not interested'],['snoozed','Snooze 30 days']]){const o=el('option',t);o.value=v;mark.append(o)}mark.onchange=()=>{if(mark.value)feedback(item.id,mark.value)};action.append(button('History',()=>history(item)),mark);tr.append(image,title,current,baseline,lowest,targetCell,priorityCell,monitorCell,status,action);return tr}
async function pollCheck(listId,check){check.disabled=true;const started=Date.now();let ticker;try{const {runId}=await api(`/api/wishlists/${listId}/check`,{method:'POST'});const label=()=>{const elapsed=Math.floor((Date.now()-started)/1000);check.textContent=`Checking… ${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,'0')}`};label();ticker=setInterval(label,1000);while(Date.now()-started<300000){await new Promise(resolve=>setTimeout(resolve,5000));const run=await api(`/api/runs/${runId}`);if(run.status==='recorded'||run.status==='failed'){await refreshCard(listId);return}}alert('The check is still running. Refresh later for its result.')}catch(e){alert(e.data?.error==='busy'?'A check is already running':e.message)}finally{clearInterval(ticker);check.disabled=false;check.textContent='Check now'}}
async function refreshCard(listId){const old=document.querySelector(`[data-list-id="${CSS.escape(listId)}"]`),open=old?.querySelector('details').open,sort=old?.querySelector('select[aria-label="Sort items"]').value;const lists=await api('/api/wishlists'),summary=lists.find(w=>w.id===listId);if(summary&&old){const card=render(summary);old.replaceWith(card);if(sort)card.querySelector('select[aria-label="Sort items"]').value=sort;if(open){const details=card.querySelector('details');details.open=true}}dealData=await api('/api/deals');renderDeals()}
async function history(item){try{const rows=await api(`/api/items/${item.id}/history`),tbody=$('#history tbody');tbody.textContent='';for(const row of rows){const tr=el('tr');tr.append(el('td',new Date(row.observed_at).toLocaleString()),el('td',money(row.price_cents)),el('td',row.availability));tbody.append(tr)}$('#history').showModal()}catch(e){alert(e.message)}}
$('#plan').onclick=async e=>{const root=$('#plan-results');e.currentTarget.disabled=true;root.textContent='Planning…';try{const data=await api(`/api/buy-next?budget=${Math.round(Number($('#budget').value)*100)}`);root.textContent='';if(!data.picks.length)root.append(el('p',data.note,'muted'));else{const list=el('ol');for(const pick of data.picks){const li=el('li'),title=el('strong',`${pick.item.title} — ${money(pick.priceCents)}`),reasons=el('div',pick.reasons.join(' · '),'muted');li.append(title,reasons,actionButtons(pick.item));list.append(li)}root.append(list)}const total=data.budgetCents-data.leftoverCents;root.append(el('div',`Total ${money(total)} · ${money(data.leftoverCents)} left · ${data.skipped} skipped`,'muted'))}catch(error){root.textContent=error.message}finally{e.currentTarget.disabled=false}};
$('#close-history').onclick=()=>$('#history').close();$('#test-email').onclick=async e=>{e.currentTarget.disabled=true;try{const result=await api('/api/test-email',{method:'POST'});alert(result.status==='sent'?'Test email sent.':'Test email failed.')}catch(error){alert(error.message)}finally{e.currentTarget.disabled=false}};
$('#search').oninput=e=>{query=e.currentTarget.value.trim().toLowerCase();renderDeals();for(const card of document.querySelectorAll('.card')){const details=card.querySelector('details'),sort=card.querySelector('select[aria-label="Sort items"]');if(card.items)renderItems(card,details,details.querySelector('summary'),sort.value)}};
$('#add').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.currentTarget),error=$('#add-error');error.textContent='';try{await api('/api/wishlists',{method:'POST',body:JSON.stringify({url:form.get('url'),frequency:form.get('frequency'),addNewItems:form.has('addNewItems')})});e.currentTarget.reset();load()}catch(ex){const messages={login_required:'This list is private or requires login',private:'This list is private',blocked:'Amazon blocked this request',not_found:'This wishlist was not found',invalid_url:'Use a shared Amazon US wishlist link'};error.textContent=messages[ex.data?.error]||ex.message}};load();
</script></body></html>
