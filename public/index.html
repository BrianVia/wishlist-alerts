<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wishlist Alerts</title>
  <style>
    :root{color-scheme:light dark;
      --bg:oklch(97% 0.008 250);--surface:oklch(99.2% 0.004 250);--raised:oklch(94.5% 0.012 250);
      --ink:oklch(24% 0.025 260);--muted:oklch(48% 0.025 258);--line:oklch(88% 0.014 250);
      --accent:oklch(50% 0.17 258);--accent-ink:oklch(99% 0.01 258);--accent-tint:oklch(93% 0.04 258);
      --sale:oklch(44% 0.11 188);--sale-tint:oklch(93% 0.05 188);
      --warn:oklch(46% 0.12 75);--warn-tint:oklch(94% 0.07 85);
      --bad:oklch(48% 0.18 25);--bad-tint:oklch(94% 0.05 25)}
    @media(prefers-color-scheme:dark){:root{
      --bg:oklch(19% 0.02 255);--surface:oklch(23% 0.02 255);--raised:oklch(28% 0.024 255);
      --ink:oklch(94% 0.01 250);--muted:oklch(70% 0.02 250);--line:oklch(33% 0.022 255);
      --accent:oklch(76% 0.12 250);--accent-ink:oklch(18% 0.03 255);--accent-tint:oklch(31% 0.06 255);
      --sale:oklch(80% 0.11 185);--sale-tint:oklch(30% 0.05 188);
      --warn:oklch(83% 0.12 85);--warn-tint:oklch(32% 0.06 80);
      --bad:oklch(78% 0.14 22);--bad-tint:oklch(32% 0.07 25)}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1040px;margin:auto;padding:clamp(14px,3vw,32px)}
    header{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:18px;margin-bottom:22px;border-bottom:2px solid var(--accent)}
    h1{font-size:1.55rem;letter-spacing:-.01em;margin:0 0 2px}h2{font-size:1.15rem;margin:0}
    .muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    form.add{display:grid;grid-template-columns:minmax(260px,1fr) auto auto auto;gap:14px;align-items:end;background:var(--accent-tint);border-radius:10px;padding:16px 18px;margin:0 0 28px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 18px}
    label{display:grid;gap:5px;font-size:.85rem;color:var(--muted)}label.check{grid-template-columns:auto 1fr;align-items:center;padding-bottom:9px}
    input,select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
    input:hover,select:hover{border-color:var(--muted)}
    button{cursor:pointer;background:var(--raised);border-color:transparent;font-weight:500}button:hover{background:var(--line)}
    button.primary{color:var(--accent-ink);background:var(--accent)}button.primary:hover{filter:brightness(1.1)}
    button:disabled{opacity:.55;cursor:wait}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}a:hover{text-decoration-thickness:2px}
    .error{color:var(--bad);min-height:1.5em;font-size:.9rem}
    .badge,.chip{white-space:nowrap;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--raised);color:var(--muted)}
    .ok{color:var(--sale);background:var(--sale-tint)}.stale{color:var(--warn);background:var(--warn-tint)}.bad{color:var(--bad);background:var(--bad-tint)}
    .chip.sale{color:var(--sale);background:var(--sale-tint)}
    details{margin-top:14px}summary{cursor:pointer;font-weight:600;color:var(--accent)}
    table{border-collapse:collapse;width:100%;margin-top:12px;font-variant-numeric:tabular-nums}
    th,td{white-space:nowrap;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
    th{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--raised)}
    tbody tr:hover{background:color-mix(in oklch,var(--accent-tint) 45%,transparent)}
    td.num{text-align:right}th.num{text-align:right}
    td.price-sale{color:var(--sale);font-weight:600}td.price-up{color:var(--bad)}
    .delta{display:block;font-size:.75rem;font-weight:500}
    img{width:40px;height:40px;object-fit:contain;background:oklch(99% 0 0);border-radius:4px}
    .item-title{min-width:220px;white-space:normal}td input[type=number]{width:96px}
    dialog{max-width:720px;width:90%;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}dialog::backdrop{background:oklch(20% 0.02 255 / .6)}
    @media(max-width:720px){form.add{grid-template-columns:1fr}.table-wrap{overflow:auto}}
  </style>
</head>
<body><main>
  <header><div><h1>Wishlist Alerts</h1><div id="email" class="muted">Loading…</div></div><button id="test-email">Send test email</button></header>
  <form id="add" class="add"><div><label for="url">Amazon wishlist URL</label><input id="url" name="url" type="url" required placeholder="https://www.amazon.com/hz/wishlist/ls/…"></div><label>Frequency<select name="frequency"><option value="daily">Daily</option><option value="hourly">Hourly</option></select></label><label class="check"><input name="addNewItems" type="checkbox" checked><span>Add new items automatically</span></label><button class="primary">Add wishlist</button><div id="add-error" class="error" role="alert"></div></form>
  <section id="lists" aria-live="polite"></section>
  <dialog id="history"><div class="row"><h2>Price history</h2><button id="close-history">Close</button></div><div class="table-wrap"><table><thead><tr><th>Observed</th><th>Price</th><th>Availability</th></tr></thead><tbody></tbody></table></div></dialog>
</main><script>
const $=s=>document.querySelector(s), api=async(path,options={})=>{const r=await fetch(path,{...options,headers:{'content-type':'application/json',...options.headers}}),data=await r.json();if(!r.ok)throw Object.assign(new Error(data.detail||data.error||'Request failed'),{status:r.status,data});return data};
const money=c=>c==null?'—':`$${(c/100).toFixed(2)}`, relative=value=>{if(!value)return'never';const seconds=Math.round((Date.parse(value)-Date.now())/1000),abs=Math.abs(seconds),unit=abs<60?'second':abs<3600?'minute':abs<86400?'hour':'day',n=unit==='second'?seconds:unit==='minute'?Math.round(seconds/60):unit==='hour'?Math.round(seconds/3600):Math.round(seconds/86400);return new Intl.RelativeTimeFormat(undefined,{numeric:'auto'}).format(n,unit)};
function el(tag,text,cls){const node=document.createElement(tag);if(text!=null)node.textContent=text;if(cls)node.className=cls;return node}function button(text,fn){const b=el('button',text);b.type='button';b.onclick=fn;return b}
async function load(){try{const [me,lists]=await Promise.all([api('/api/me'),api('/api/wishlists')]);$('#email').textContent=me.email;const root=$('#lists');root.textContent='';if(!lists.length){root.append(el('p','No wishlists yet. Paste a shared Amazon wishlist link above.','muted'));return}for(const summary of lists){const detail=await api(`/api/wishlists/${summary.id}`);root.append(render(detail))}}catch(e){$('#lists').textContent=e.message}}
function render(data){const w=data.wishlist,card=el('article',null,'card'),top=el('div',null,'row'),heading=document.createElement('div');heading.append(el('h2',w.name),el('span',`${data.items.length} item(s) · ${w.frequency} · last checked ${relative(w.last_success_at)}`,'muted'));const state=w.stale?'stale':w.last_status||'stale',badge=el('span',state,state==='ok'?'badge ok':state==='stale'?'badge stale':'badge bad');heading.append(' ',badge);if(w.last_error)heading.append(el('div',w.last_error,'error'));const controls=el('div',null,'row'),pause=button(w.monitored?'Pause':'Resume',async()=>{await api(`/api/wishlists/${w.id}`,{method:'PATCH',body:JSON.stringify({monitored:!w.monitored})});load()}),check=button('Check now',async()=>{check.disabled=true;check.textContent='checking…';try{await api(`/api/wishlists/${w.id}/check`,{method:'POST'});setTimeout(load,10000)}catch(e){alert(e.message);check.disabled=false;check.textContent='Check now'}}),freq=el('select');for(const value of['daily','hourly']){const o=el('option',value[0].toUpperCase()+value.slice(1));o.value=value;o.selected=w.frequency===value;freq.append(o)}freq.setAttribute('aria-label','Check frequency');freq.onchange=async()=>{await api(`/api/wishlists/${w.id}`,{method:'PATCH',body:JSON.stringify({frequency:freq.value})});load()};controls.append(pause,check,freq);top.append(heading,controls);card.append(top);
 const details=el('details'),summary=el('summary',`Items (${data.items.length})`),wrap=el('div',null,'table-wrap'),table=el('table'),thead=el('thead'),hr=el('tr');for(const h of['','Item','Current','First seen','Lowest','Target','Monitor','Status','']){const th=el('th',h);if(['Current','First seen','Lowest'].includes(h))th.className='num';hr.append(th)}thead.append(hr);const tbody=el('tbody');for(const item of data.items)tbody.append(itemRow(item));table.append(thead,tbody);wrap.append(table);details.append(summary,wrap);card.append(details);return card}
function itemRow(item){const tr=el('tr'),image=el('td');if(item.image_url){const img=el('img');img.src=item.image_url;img.alt='';image.append(img)}const title=el('td',null,'item-title'),link=el('a',item.title);link.href=item.product_url;link.target='_blank';link.rel='noopener';title.append(link);const current=el('td',money(item.current_cents),'num'),baseline=el('td',money(item.baseline_cents),'num'),lowest=el('td',money(item.lowest_cents),'num');if(item.current_cents!=null&&item.baseline_cents>0&&item.current_cents!==item.baseline_cents){const pct=Math.round((item.current_cents-item.baseline_cents)/item.baseline_cents*100);current.className+=pct<0?' price-sale':' price-up';current.append(el('span',`${pct>0?'+':''}${pct}% vs first`,'delta'))}const targetCell=el('td'),target=el('input');target.type='number';target.step='.01';target.min='0';target.value=item.target_cents==null?'':(item.target_cents/100).toFixed(2);target.setAttribute('aria-label',`Target price for ${item.title}`);target.onchange=()=>api(`/api/items/${item.id}`,{method:'PATCH',body:JSON.stringify({targetCents:target.value===''?null:Math.round(Number(target.value)*100)})}).catch(e=>alert(e.message));targetCell.append(target);const monitorCell=el('td'),monitor=el('input');monitor.type='checkbox';monitor.checked=!!item.monitored;monitor.setAttribute('aria-label',`Monitor ${item.title}`);monitor.onchange=()=>api(`/api/items/${item.id}`,{method:'PATCH',body:JSON.stringify({monitored:monitor.checked})}).catch(e=>alert(e.message));monitorCell.append(monitor);const statusText=item.alert_active?'on sale':item.availability==='unavailable'?'unavailable':item.current_cents==null?'no price':'watching',status=el('td');status.append(el('span',statusText,item.alert_active?'chip sale':'chip'));status.append(el('div',relative(item.observed_at),'muted'));const action=el('td');action.append(button('History',()=>history(item)));tr.append(image,title,current,baseline,lowest,targetCell,monitorCell,status,action);return tr}
async function history(item){try{const rows=await api(`/api/items/${item.id}/history`),tbody=$('#history tbody');tbody.textContent='';for(const row of rows){const tr=el('tr');tr.append(el('td',new Date(row.observed_at).toLocaleString()),el('td',money(row.price_cents)),el('td',row.availability));tbody.append(tr)}$('#history').showModal()}catch(e){alert(e.message)}}
$('#close-history').onclick=()=>$('#history').close();$('#test-email').onclick=async e=>{e.currentTarget.disabled=true;try{const result=await api('/api/test-email',{method:'POST'});alert(result.status==='sent'?'Test email sent.':'Test email failed.')}catch(error){alert(error.message)}finally{e.currentTarget.disabled=false}};
$('#add').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.currentTarget),error=$('#add-error');error.textContent='';try{await api('/api/wishlists',{method:'POST',body:JSON.stringify({url:form.get('url'),frequency:form.get('frequency'),addNewItems:form.has('addNewItems')})});e.currentTarget.reset();load()}catch(ex){const messages={login_required:'This list is private or requires login',private:'This list is private',blocked:'Amazon blocked this request',not_found:'This wishlist was not found',invalid_url:'Use a shared Amazon US wishlist link'};error.textContent=messages[ex.data?.error]||ex.message}};load();
</script></body></html>
